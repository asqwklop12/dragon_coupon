pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'org.springframework.boot' version '4.0.0'
        id 'io.spring.dependency-management' version '1.1.7'
    }
}

rootProject.name = 'dragon_coupon'
include(":apps:dragons_api")
include(":domain")
include(":common")
include(":infra:jackson")
include(":infra:jpa")
include("infra:logging")
include("infra:kafka")
include("infra:redis")
